name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} dist/InpuLync-v1.4.0.apk \;
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: InpuLync-v1.4.0-APK
          path: dist/InpuLync-v1.4.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: "InpuLync v1.4.0 Official Release"
          body: |
            ### ⚡ InpuLync v1.4.0 — High-Performance & Zero-Click Connect

            Turn your Android phone into an ultra-low latency wireless/wired peripheral!

            #### 🚀 What's New in v1.4.0
            - **250 Hz Low-Latency HID Engine (4ms)**: Double the polling frequency for immediate mouse responsiveness and stutter-free tracking.
            - **Sub-Pixel Touch Calculations**: Float-based coordinate deltas prevent touch micro-stalls and jitter.
            - **Zero-Click Auto-Connect**: Remembers paired hosts and automatically targets & connects immediately upon launching the app.
            - **Instant Wake & Pairing Reconnect**: Reconnects within 300ms when your laptop wakes from sleep or right after completing Bluetooth pairing.
            - **800ms Fast Recovery Engine**: Rapidly recovers the HID link if the Bluetooth connection drops or temporarily loses range.
            - **Refined Glass & Aurora UI**: Fixed portrait Aurora particle drift, responsive drawer menus, and eliminated popup window leaks.

            #### 📥 Direct Download
            Download **`InpuLync-v1.4.0.apk`** below to install directly on your Android phone!
          files: dist/InpuLync-v1.4.0.apk
