name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} dist/InpuLync-v1.5.0.apk \;
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: InpuLync-v1.5.0-APK
          path: dist/InpuLync-v1.5.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: "InpuLync v1.5.0 Official Release"
          body: |
            ### ⚡ InpuLync v1.5.0 — Air Mouse & Presentation Edition

            Turn your Android phone into an ultra-low latency wireless gyro remote, presentation clicker, and desktop peripheral!

            #### 🎯 What's New in v1.5.0
            - **🎯 Air Mouse (Gyroscope Motion Control)**: Control your PC cursor in mid-air simply by tilting or pointing your phone with built-in gyroscope sensor.
            - **🕹️ Hold-to-Aim Clutch & Lock Mode**: Ergonomic touch trigger on the holographic reticle — hold thumb to aim, lift to lock cursor, or toggle Always-On.
            - **🌊 World-Space Gravity Projection & Anti-Jitter Filter**: Cursor moves straight and true regardless of phone incline, with adaptive low-pass smoothing eliminating natural hand tremors.
            - **📊 PowerPoint & Google Slides Presenter Deck**: Dedicated remote buttons for Next Slide, Prev Slide, F5 Start Slideshow, and 'B' Blank Screen.
            - **🍿 Couch Media Remote**: Relax on your couch and control YouTube / Netflix / VLC with Play/Pause, Volume dials, Mute, and Fullscreen toggle.
            - **📱 Dual Mode Switcher**: Seamlessly switch between touch trackpad and Air Mouse in portrait or landscape orientations.

            #### 📥 Direct Download
            Download **`InpuLync-v1.5.0.apk`** below to install directly on your Android phone!
          files: dist/InpuLync-v1.5.0.apk
