name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} dist/InpuLync-v1.3.0.apk \;
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: InpuLync-v1.3.0-APK
          path: dist/InpuLync-v1.3.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "InpuLync v1.3.0 Official Release"
          body: |
            ### 📱 InpuLync v1.3.0

            Turn your Android phone into an ultra-low latency wireless/wired peripheral!

            #### ✨ Key Features
            - **Zero Driver Bluetooth HID**: Native composite keyboard, multi-touch trackpad, and gamepad.
            - **9 Translucent Glass Themes**: Aurora, Frost, Midnight, Sunset, Ocean, Forest, Sakura, AMOLED, and Custom HSV hue slider.
            - **Portrait Remote Mode**: One-handed vertical trackpad with haptic scroll strip and quick media controls.
            - **Dedicated NUMPAD**: Full numeric keypad in landscape mode (`TOOLS ▾ → NUMPAD`).
            - **PS3-Inspired Gamepad**: Dual clickable analog thumbsticks, 8-way D-Pad, face buttons, and analog triggers.

            #### 📥 Direct Download
            Download **`InpuLync-v1.3.0.apk`** below to install directly on your Android phone!
          files: dist/InpuLync-v1.3.0.apk
