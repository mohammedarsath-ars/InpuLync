name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} dist/InpuLync.apk \;
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} dist/InpuLync-v1.3.0.apk \;
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: InpuLync-v1.3.0-APK
          path: dist/*.apk
          if-no-files-found: error
