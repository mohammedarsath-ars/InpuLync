plugins {
    id 'com.android.application'
}

android {
    namespace 'com.inpulync.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.inpulync.app'
        minSdk 28
        targetSdk 34
        versionCode 6
        versionName '1.5.0'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "InpuLync-v${variant.versionName}.apk"
        }
    }
}
